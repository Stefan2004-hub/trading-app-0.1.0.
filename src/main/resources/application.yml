spring:
  application:
    name: ${APP_NAME:trading-app}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:trading_app}?sslmode=require}
    username: ${DB_USERNAME:${PGUSER:trading_user}}
    password: ${DB_PASSWORD:${PGPASSWORD:trading_password}}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:sample-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:sample-google-client-secret}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:sample-jwt-secret-change-in-production}
      access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  coingecko:
    base-url: ${APP_COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
    api-key: ${APP_COINGECKO_API_KEY:}
  historical:
    sync:
      batch-size: ${APP_HISTORICAL_SYNC_BATCH_SIZE:50}
      sleep-ms-between-batches: ${APP_HISTORICAL_SYNC_SLEEP_MS_BETWEEN_BATCHES:1200}
  spot-price:
    coinbase-base-url: ${APP_SPOT_PRICE_COINBASE_BASE_URL:https://api.coinbase.com}
    gate-io-base-url: ${APP_SPOT_PRICE_GATE_IO_BASE_URL:https://api.gateio.ws/api/v4}
    cache-ttl-millis: ${APP_SPOT_PRICE_CACHE_TTL_MILLIS:30000}
    connect-timeout-millis: ${APP_SPOT_PRICE_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${APP_SPOT_PRICE_READ_TIMEOUT_MILLIS:3000}
